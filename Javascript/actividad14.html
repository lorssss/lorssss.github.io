<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Actividades JavaScript</title>
    <link rel="stylesheet" href="css_calculadora.css">
</head>
<body>

<div class="calculadora">

    <h2 class="titulo">Calculadora</h2>

    <input type="text" id="pantalla" class="pantalla" disabled>

    <div class="botones">

        
        <button class="rojo" onclick="limpiarPantalla()">C</button>
        <button class="del" onclick="borrarUltimo()">DEL</button>
        <button class="operador" onclick="agregarValor('/')">/</button>

        
        <button onclick="agregarValor('7')">7</button>
        <button onclick="agregarValor('8')">8</button>
        <button onclick="agregarValor('9')">9</button>
        <button class="operador" onclick="agregarValor('*')">*</button>

        
        <button onclick="agregarValor('4')">4</button>
        <button onclick="agregarValor('5')">5</button>
        <button onclick="agregarValor('6')">6</button>
        <button class="operador" onclick="agregarValor('-')">-</button>

      
        <button onclick="agregarValor('1')">1</button>
        <button onclick="agregarValor('2')">2</button>
        <button onclick="agregarValor('3')">3</button>
        <button class="operador" onclick="agregarValor('+')">+</button>

        
        <button class="cero" onclick="agregarValor('0')">0</button>
        <button onclick="agregarValor('.')">.</button>
        <button class="igual" onclick="calcularResultado()">=</button>

    </div>
</div>

<footer class="pie">
        <p><a href="index.html" class="boton-volver">Volver al inicio</a></p>
    </footer>
